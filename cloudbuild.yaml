steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=$_GEMINI_API_KEY'
      - '-t'
      - 'gcr.io/$PROJECT_ID/speechero-app'
      - '.'

  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/speechero-app']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'speechero-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/speechero-app'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated' # Make service private

# Substitutions allow us to pass variables at trigger time
substitutions:
  _GEMINI_API_KEY: 'YOUR_KEY_HERE_OR_SET_IN_TRIGGER'

images:
  - 'gcr.io/$PROJECT_ID/speechero-app'
